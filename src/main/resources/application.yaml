server:
  port: 8081

spring:
  application:
    name: authentication-service
  profiles:
    active: local

  datasource:
    hikari:
      connection-timeout: 5000

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%5p) %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{36}){cyan} [%X{traceId:-none}] : %m%n"
  level:
    root: INFO