services:
  auth-service-db:
    image: postgres:17-alpine
    container_name: auth-service-db-container
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_service_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_service_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service-app
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      DB_HOST: auth-service-db
      DB_NAME: ${POSTGRES_DB:-auth_service_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://host.docker.internal:8080}
    depends_on:
      auth-service-db:
        condition: service_healthy

volumes:
  pgdata_auth:

networks:
  default:
    name: microservices-net
    external: true